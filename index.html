<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <max-seo-meta page="home"></max-seo-meta>

    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="page-home">
    <max-hero-bg></max-hero-bg>
    <max-site-nav></max-site-nav>

    <main class="home-main">
      <section class="home-hero" aria-labelledby="home-title">
        <div class="home-hero-copy">
          <max-badge></max-badge>
          <h1 id="home-title"><max-site-name></max-site-name></h1>
          <max-tagline></max-tagline>
          <max-link-list variant="hero"></max-link-list>
        </div>

        <div class="home-hero-media" aria-hidden="true">
          <div class="home-portrait-frame">
            <max-profile-img></max-profile-img>
          </div>
          <div class="home-note">
            <span>Tenor</span>
            <strong>Ópera & entretenimento</strong>
          </div>
        </div>
      </section>

      <max-social-follow></max-social-follow>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
  </body>
</html>
