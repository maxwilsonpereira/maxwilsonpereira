<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <max-seo-meta page="home"></max-seo-meta>

    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body class="page-home">
    <max-hero-bg></max-hero-bg>
    <max-site-nav></max-site-nav>

    <main class="home-main">
      <section class="home-hero" aria-labelledby="home-title">
        <img
          src="assets/hebe-camargo.jpg"
          alt="Max Wilson Pereira em apresentação no DVD de Hebe Camargo"
          class="home-hero-img"
        />
        <div class="home-hero-overlay"></div>

        <div class="home-hero-copy">
          <max-badge></max-badge>
          <h1 id="home-title"><max-site-name></max-site-name></h1>
          <max-tagline></max-tagline>
        </div>
      </section>

      <max-social-follow></max-social-follow>
    </main>

    <max-site-footer></max-site-footer>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
  </body>
</html>
